# Teacher variants for the Stage 1 probes. All teachers produce 16x16 tokens of 1024 dims per frame,
# the same shape as the DINO-Video target. ${VAR} is expanded from the environment (pod.env sets D
# and W); relative `weights` / `source` paths are resolved against weights_dir.
#
# clip frames are positions within the chunk: 0 is the current frame, 49 is the training future
# frame. A repeated position keeps the first tubelet free of future frames.

weights_dir: ${D}/weights/vjepa

variants:
  V0:  # DINO-Video, the training baseline, through get_video_target
    teacher: dino_video
    clip_frames: [0, 49]  # get_video_target builds [f_t, f_t, f_t+49] itself (use_warmup_frame)
    video:  # align_params.video of configs/vla/robotwin/robotwin.yaml, the keys get_video_target reads
      ckpt_path: ${W}/lingbot-vla-v2-6b/dino_video/teacher_step_10000.pth
      config_path: ${W}/lingbot-vla-v2-6b/dino_video/config.yaml
      attention_mode: flex_block_causal
      input_size: 256
      num_future_frames: 1
      use_warmup_frame: true
      effective_fps: 1.0
      n_blocks: 1
      cls_pool: last
      use_patch_loss: true
      use_current_patch_loss: true
      use_cls_loss: false

  B-pixel:  # baseline: both frames shrunk to 16x16 RGB
    teacher: pixel
    clip_frames: [0, 49]

  V1:  # V-JEPA 2 ViT-L, current and future frames in one clip
    teacher: hf_vjepa2
    weights: vjepa2-vitl-fpc64-256
    input_size: 256
    clip_frames: [0, 0, 49, 49]
    current_index: 0
    layer: last

  V1i:  # same model, each frame encoded on its own
    teacher: hf_vjepa2
    weights: vjepa2-vitl-fpc64-256
    input_size: 256
    clip_frames: [0, 0]
    future_clip_frames: [49, 49]
    current_index: 0
    layer: last

  V1m:  # same clip as V1, features from a middle layer
    teacher: hf_vjepa2
    weights: vjepa2-vitl-fpc64-256
    input_size: 256
    clip_frames: [0, 0, 49, 49]
    current_index: 0
    layer: 16

  V2:  # 8 frames: the first tubelet is the current frame twice, the last is the future
    teacher: hf_vjepa2
    weights: vjepa2-vitl-fpc64-256
    input_size: 256
    clip_frames: [0, 0, 8, 16, 24, 33, 41, 49]
    current_index: 0
    layer: last

  V3:  # V-JEPA 2.1 ViT-L at 256 (RoPE interpolation), encoder weights only
    teacher: vjepa2_1
    source: vjepa2-src
    weights: vjepa2_1_vitl_384_ema_encoder.pt
    input_size: 256
    clip_frames: [0, 0, 49, 49]
    current_index: 0
    layer: last

  V3h:  # V-JEPA 2.1 at its native 384, tokens resampled from 24x24 down to 16x16
    teacher: vjepa2_1
    source: vjepa2-src
    weights: vjepa2_1_vitl_384_ema_encoder.pt
    input_size: 384
    resample_to: 16
    clip_frames: [0, 0, 49, 49]
    current_index: 0
    layer: last
